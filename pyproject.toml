[project]
name = "zikai"
version = "1.0.0"
description = "Decisions-API service that maps the chineseidioms.com chengyu corpus into a shallow clustered decision tree and serves the most applicable idiom for any text."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zikai = "zikai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zikai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
